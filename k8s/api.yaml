# The scoring API as a Deployment (with probes) + a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-pd-api
  labels:
    app: credit-pd-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credit-pd-api
  template:
    metadata:
      labels:
        app: credit-pd-api
    spec:
      containers:
        - name: api
          image: credit-pd-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: credit-pd-api
spec:
  selector:
    app: credit-pd-api
  ports:
    - port: 8000
      targetPort: 8000