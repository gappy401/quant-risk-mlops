apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credit-pd-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credit-pd-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50